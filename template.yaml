AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: PromptLens - Prompt Regression Testing Tool

Globals:
  Function:
    Timeout: 30
    Runtime: python3.11
    MemorySize: 256
    Tracing: Active
    Environment:
      Variables:
        TABLE_NAME: !Ref PromptLensTable

Resources:
  ServerlessRestApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      Cors:
        AllowMethods: "'GET,POST,PUT,PATCH,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"
      TracingEnabled: true

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: PromptLensApi
      Handler: src.handlers.api.handler
      CodeUri: .
      Description: PromptLens API Handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        CatchAll:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: ANY
            RestApiId: !Ref ServerlessRestApi
        Root:
          Type: Api
          Properties:
            Path: /
            Method: ANY
            RestApiId: !Ref ServerlessRestApi
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PromptLensTable
        - BedrockInvokeModelPolicy:
            ModelId: "*"

  PromptLensTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: PromptLens
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false
      Tags:
        - Key: Project
          Value: PromptLens
        - Key: Environment
          Value: Dev

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: PromptLensLambdaRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: PromptLensDynamoDBPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !GetAtt PromptLensTable.Arn
                  - !Sub "${PromptLensTable.Arn}/index/*"
        - PolicyName: PromptLensBedrockPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource: "*"
        - PolicyName: PromptLensCloudWatchPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"

Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
    Export:
      Name: PromptLensApiEndpoint

  DynamoDBTableName:
    Description: DynamoDB table name
    Value: !Ref PromptLensTable
    Export:
      Name: PromptLensTableName

  LambdaFunctionName:
    Description: Lambda function name
    Value: !Ref ApiFunction
    Export:
      Name: PromptLensFunctionName

  IAMRoleArn:
    Description: IAM execution role ARN
    Value: !GetAtt LambdaExecutionRole.Arn
    Export:
      Name: PromptLensRoleArn
